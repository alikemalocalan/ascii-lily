<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clara & The ASCII Lilies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    #ascii-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      display: block;
    }

    /* Minimal floating controls - auto-hide */
    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(16, 16, 20, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 20px;
      border-radius: 30px;
      opacity: 0;
      transition: opacity 0.35s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
    }

    body:hover .controls,
    .controls:hover,
    .controls.active {
      opacity: 1;
    }

    .btn {
      background: transparent;
      border: none;
      color: #d0d0d0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 240px;
    }

    .slider {
      flex: 1;
      -webkit-appearance: none;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      cursor: pointer;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #52b788;
      box-shadow: 0 0 10px #52b788;
      cursor: pointer;
    }

    .label {
      font-size: 0.72rem;
      color: #aaaaaa;
      min-width: 36px;
      font-family: inherit;
    }

    .tag-btn {
      font-size: 0.7rem;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #cccccc;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tag-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-color: #52b788;
    }
  </style>
</head>

        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
      </svg>
    </button>

        <path d="M1 4v6h6M23 20v-6h-6"/>
        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
      </svg>
    </button>

    <div class="slider-wrap">
      <input type="range" class="slider" id="bloom-slider" min="0" max="1" step="0.002" value="0">

    </div>

    function easeInOutCubic(x) {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }

    function getBezierPoint(p0, p1, p2, p3, t) {
      const u = 1 - t;
      const tt = t * t;
      const uu = u * u;
      const uuu = uu * u;
      const ttt = tt * t;
      return {
        x: uuu * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + ttt * p3.x,
        y: uuu * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + ttt * p3.y
      };
    }

    // --- DRAW CLARA (SYNCHRONIZED EYE OPENING, SMILING & OLIVE CROWN SPROUTING) ---
    function drawClara(v, progress, tTime) {
      if (imagesLoaded < 4) return;

      const cX = 35;
      const cY = 140;
      const cW = 730;
      const cH = 730;

      // Organic subtle breathing movement
      const breathY = Math.sin(tTime * 1.5) * 2.5;

      v.save();
      v.translate(cX, cY + breathY);

      // Smooth, 4-stage progression across the entire animation (100% in sync with lilies):
      // 0.00 -> 0.333: closed -> sprout (eyes gently crack open, smile begins, olive shoot peeks out of hair)
      // 0.333 -> 0.666: sprout -> growing (eyes open halfway, warm smile, olive branch wraps across hair)
      // 0.666 -> 1.000: growing -> crown (eyes open fully clear blue, radiant smile, full Roman olive wreath crown)
      if (progress <= 0.333) {
        const t = easeInOutCubic(progress / 0.333);
        v.drawImage(img0, 0, 0, cW, cH);
        if (t > 0.001) {
          v.save();
          v.globalAlpha = t;
          v.drawImage(img1, 0, 0, cW, cH);
          v.restore();
        }
      } else if (progress <= 0.666) {
        const t = easeInOutCubic((progress - 0.333) / 0.333);
        v.drawImage(img1, 0, 0, cW, cH);
        if (t > 0.001) {
          v.save();
          v.globalAlpha = t;
          v.drawImage(img2, 0, 0, cW, cH);
          v.restore();
        }
      } else {
        const t = easeInOutCubic((progress - 0.666) / 0.334);
        v.drawImage(img2, 0, 0, cW, cH);
        if (t > 0.001) {
          v.save();
          v.globalAlpha = t;
          v.drawImage(img3, 0, 0, cW, cH);
          v.restore();
        }
      }

      // Delicate golden-olive stardust halo that grows naturally with the olive crown
      if (progress > 0.10) {
        const haloStrength = Math.min(1.0, (progress - 0.10) / 0.90);
        v.save();
        v.fillStyle = `rgba(183, 228, 199, ${haloStrength * 0.35})`;
        for (let b = 0; b < 20; b++) {
          const angle = (b / 20) * Math.PI * 2 + tTime * 1.6;
          const rad = 230 + Math.sin(b * 3.1 + tTime * 2.2) * 22;
          const bx = cW * 0.52 + Math.cos(angle) * rad;
          const by = cH * 0.30 + Math.sin(angle) * (rad * 0.55);
          v.beginPath();
          v.arc(bx, by, 1.6 + haloStrength * 1.4, 0, Math.PI * 2);
          v.fill();
        }
        v.restore();
      }

      v.restore();
    }

    // --- DRAW VECTOR SCENE (CLARA + BOUQUET + AMBIENT AURORA) ---
    function drawVectorScene(v, progress, tTime) {
      v.clearRect(0, 0, CONFIG.baseW, CONFIG.baseH);

      // 1. Dynamic Celestial Aurora ("arada arka plan renkleri de güzelleşsin")
      const bloomGlow = Math.min(1.0, progress * 1.15);

      // Deep celestial nebula background
      const bgGrad = v.createLinearGradient(0, 0, CONFIG.baseW, CONFIG.baseH);
      bgGrad.addColorStop(0.0, `rgba(5, 8, 22, ${0.40 * bloomGlow})`);
      bgGrad.addColorStop(0.5, `rgba(22, 10, 30, ${0.30 * bloomGlow})`);
      bgGrad.addColorStop(1.0, `rgba(8, 18, 18, ${0.40 * bloomGlow})`);
      v.fillStyle = bgGrad;
      v.fillRect(0, 0, CONFIG.baseW, CONFIG.baseH);

      // Warm romantic glow behind Bouquet (right side)
      if (bloomGlow > 0.01) {
        const pulse = 1 + Math.sin(tTime * 2.0) * 0.04;
        const rgBouquet = v.createRadialGradient(1140, 500, 50 * pulse, 1140, 500, 560 * pulse);
        rgBouquet.addColorStop(0.0, `rgba(255, 90, 120, ${0.32 * bloomGlow})`);
        rgBouquet.addColorStop(0.35, `rgba(255, 180, 80, ${0.24 * bloomGlow})`);
        rgBouquet.addColorStop(0.68, `rgba(140, 30, 180, ${0.15 * bloomGlow})`);
        rgBouquet.addColorStop(1.0, "rgba(0, 0, 0, 0)");

        v.fillStyle = rgBouquet;
        v.fillRect(520, 0, 1080, CONFIG.baseH);
      }

      // Ethereal emerald-gold aura behind Clara (left side)
      if (bloomGlow > 0.01) {
        const pulseC = 1 + Math.cos(tTime * 1.8) * 0.03;
        const rgClara = v.createRadialGradient(390, 380, 40 * pulseC, 390, 380, 460 * pulseC);
        rgClara.addColorStop(0.0, `rgba(116, 198, 157, ${0.30 * bloomGlow})`);
        rgClara.addColorStop(0.38, `rgba(255, 225, 90, ${0.18 * bloomGlow})`);
        rgClara.addColorStop(0.75, `rgba(25, 85, 95, ${0.10 * bloomGlow})`);
        rgClara.addColorStop(1.0, "rgba(0, 0, 0, 0)");

        v.fillStyle = rgClara;
        v.fillRect(0, 0, 850, CONFIG.baseH);
      }

      // 2. Render Clara on the Left Side
      drawClara(v, progress, tTime);

      // 3. Render Bouquet on the Right Side (Translated to x: 670, y: -20)
      v.save();
      v.translate(670, -20);
      drawBouquetElements(v, progress, tTime);
      v.restore();

      // 4. Drifting Golden Pollen & Stardust from Flowers towards Clara
      if (progress > 0.15) {
        const pollenCount = Math.floor(progress * 28);
        v.save();
        for (let p = 0; p < pollenCount; p++) {
          const pSeed = p * 137.5;
          const px = ((CONFIG.baseW - (tTime * 45 + pSeed * 10) % CONFIG.baseW) + CONFIG.baseW) % CONFIG.baseW;
          const py = 250 + Math.sin(tTime * 1.4 + p) * 120 + ((p * 73) % 400);
          const pAlpha = (0.3 + 0.7 * Math.sin(tTime * 2.5 + p)) * Math.min(1.0, (progress - 0.15) / 0.4);
          v.fillStyle = p % 2 === 0 ? `rgba(255, 215, 0, ${pAlpha * 0.6})` : `rgba(216, 243, 220, ${pAlpha * 0.5})`;
          v.beginPath();
          v.arc(px, py, 1.2 + (p % 3) * 0.6, 0, Math.PI * 2);
          v.fill();
        }
        v.restore();
      }
    }

    // --- DRAW BOUQUET ELEMENTS ---
    function drawBouquetElements(v, progress, tTime) {
      // Bouquet is standing proudly from the beginning in its full botanical poise
      const stemGrowth = 1.0;

      // 1. Tall Background Grasses & Wheat Stalks
      TALL_GRASSES.forEach((grass, idx) => {
        const sway = Math.sin(tTime * 1.5 + idx) * 7;
        const curX = grass.x + sway;
        const curY = grass.y;

        v.strokeStyle = "#1b4332";
        v.lineWidth = 4.2;
        v.beginPath();
        v.moveTo(grass.stemStartX, grass.stemStartY);
        v.bezierCurveTo(grass.c1.x + sway * 0.3, grass.c1.y, grass.c2.x + sway * 0.7, grass.c2.y, curX, curY);
        v.stroke();

        v.save();
        v.translate(curX, curY);
        v.rotate(grass.tilt + Math.sin(tTime + idx) * 0.05);
        v.fillStyle = "#52b788";
        for (let g = 0; g < 13; g++) {
          const gy = -g * 9;
          const gw = (1 - g / 14) * 11;
          v.beginPath();
          v.ellipse(g % 2 === 0 ? -gw : gw, gy, 4, 9.5, (g % 2 === 0 ? -0.4 : 0.4), 0, Math.PI * 2);
          v.fill();
        }
        v.restore();
      });

      // 2. Thick Bundled Stems
      LILIES.forEach((lily, idx) => {
        const sway = Math.sin(tTime * 1.2 + idx * 0.7) * 5;
        const curX = lily.x + sway;
        const curY = lily.y;

        const bundleX = 455 + (idx - 3.5) * 4;
        const p0 = { x: bundleX, y: 1000 };
        const p1 = { x: lily.c1.x + sway * 0.3, y: lily.c1.y };
        const p2 = { x: lily.c2.x + sway * 0.7, y: lily.c2.y };
        const p3 = { x: curX, y: curY };

        v.strokeStyle = "#081c15";
        v.lineWidth = 11;
        v.beginPath();
        v.moveTo(p0.x, p0.y);
        v.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
        v.stroke();

        v.strokeStyle = "#2d6a4f";
        v.lineWidth = 7;
        v.stroke();

        v.strokeStyle = "#74c69d";
        v.lineWidth = 2.8;
        v.stroke();
      });

      // 3. Draw Detailed Cauline Leaves Growing Along the Stems
      STEM_LEAVES.forEach((leaf, lIdx) => {
        const lily = LILIES[leaf.stemIdx];
        const sway = Math.sin(tTime * 1.2 + leaf.stemIdx * 0.7) * 5;
        const bundleX = 455 + (leaf.stemIdx - 3.5) * 4;
        const p0 = { x: bundleX, y: 1000 };
        const p1 = { x: lily.c1.x + sway * 0.3, y: lily.c1.y };
        const p2 = { x: lily.c2.x + sway * 0.7, y: lily.c2.y };
        const curX = lily.x + sway;
        const curY = lily.y;
        const p3 = { x: curX, y: curY };

        const pt = getBezierPoint(p0, p1, p2, p3, leaf.t);

        v.save();
        v.translate(pt.x, pt.y);
        const leafSway = Math.sin(tTime * 1.6 + lIdx * 0.5) * 0.06;
        v.rotate(leaf.angle + leafSway);

        drawDetailedLanceolateLeaf(v, leaf.len, leaf.wid, leaf.side);
        v.restore();
      });

      // 4. Background Broad Base Leaves (behind flowers)
      BROAD_BASE_LEAVES.filter(l => !l.isFront).forEach((leaf, idx) => {
        const sway = Math.sin(tTime * 1.4 + idx) * 4;
        drawBroadLilyLeaf(v, leaf.startX, leaf.startY, leaf.tipX + sway, leaf.tipY, leaf.maxWid, leaf.curveX + sway * 0.5, leaf.curveY, 1.0);
      });

      // 5. Render All 8 Lilies (Synchronized 0.0 -> 1.0: Realistic Buds -> Unfolding -> Full Bloom)
      const renderOrder = [4, 3, 5, 6, 7, 0, 1, 2];

      renderOrder.forEach(idx => {
        const lily = LILIES[idx];
        const sway = Math.sin(tTime * 1.2 + idx * 0.7) * 5;
        const curX = lily.x + sway;
        const curY = lily.y;

        // Subtle per-flower stagger for organic naturalness
        const stagger = (idx % 3) * 0.015;
        const localT = Math.min(1.0, Math.max(0.0, (progress - stagger) / (1.0 - stagger)));
        const flowerScale = lily.scale * (0.90 + 0.10 * localT);

        v.save();
        v.translate(curX, curY);
        v.rotate(lily.tilt + Math.sin(tTime * 1.1 + idx) * 0.04);
        v.scale(flowerScale, flowerScale);

        if (localT <= 0.001) {
          drawRealisticLilyBud(v, lily.palette, 0.0, tTime + idx);
        } else if (localT < 0.25) {
          const budOpening = localT / 0.25;
          drawRealisticLilyBud(v, lily.palette, budOpening, tTime + idx);
        } else {
          const flowerBloom = (localT - 0.25) / 0.75;
          const easedBloom = easeInOutCubic(flowerBloom);
          drawBloomingLily(v, easedBloom, lily.palette, tTime + idx);
        }

        v.restore();
      });

      // 6. Foreground Broad Base Leaves (In Front of stems & lower flower bases!)
      BROAD_BASE_LEAVES.filter(l => l.isFront).forEach((leaf, idx) => {
        const sway = Math.sin(tTime * 1.4 + idx * 0.7) * 4;
        drawBroadLilyLeaf(v, leaf.startX, leaf.startY, leaf.tipX + sway, leaf.tipY, leaf.maxWid, leaf.curveX + sway * 0.5, leaf.curveY, 1.0);
      });

      // Bouquet Base Wrap / Ribbon Tie
      v.save();
      v.translate(460, 990);
      v.fillStyle = "rgba(40, 140, 80, 0.6)";
      v.strokeStyle = "#74c69d";
      v.lineWidth = 2.5;
      v.beginPath();
      v.ellipse(0, 0, 36, 12, 0, 0, Math.PI * 2);
      v.fill();
      v.stroke();
      v.restore();
    }

    // --- DRAW BROAD DETAILED LILY FOLIAGE LEAF ---
    function drawBroadLilyLeaf(v, startX, startY, tipX, tipY, maxWid, curveX, curveY, growth) {
      if (growth <= 0.01) return;

      v.save();

      const curTipX = startX + (tipX - startX) * growth;
      const curTipY = startY + (tipY - startY) * growth;
      const curCtrlX = startX + (curveX - startX) * growth;
      const curCtrlY = startY + (curveY - startY) * growth;

      const dx = curTipX - startX;
      const dy = curTipY - startY;
      const len = Math.hypot(dx, dy);
      if (len < 6) { v.restore(); return; }

      const ux = dx / len;
      const uy = dy / len;
      const nx = -uy;
      const ny = ux;

      const w = maxWid * growth;

      const baseW = w * 0.22;
      const bLx = startX + nx * baseW;
      const bLy = startY + ny * baseW;
      const bRx = startX - nx * baseW;
      const bRy = startY - ny * baseW;

      const midCtrlX = curCtrlX;
      const midCtrlY = curCtrlY;

      const belly1X = startX + ux * (len * 0.38) + (midCtrlX - (startX + curTipX) * 0.5) * 0.6 + nx * w;
      const belly1Y = startY + uy * (len * 0.38) + (midCtrlY - (startY + curTipY) * 0.5) * 0.6 + ny * w;
      const taper1X = startX + ux * (len * 0.75) + (midCtrlX - (startX + curTipX) * 0.5) * 0.8 + nx * (w * 0.55);
      const taper1Y = startY + uy * (len * 0.75) + (midCtrlY - (startY + curTipY) * 0.5) * 0.8 + ny * (w * 0.55);

      const belly2X = startX + ux * (len * 0.38) + (midCtrlX - (startX + curTipX) * 0.5) * 0.6 - nx * w;
      const belly2Y = startY + uy * (len * 0.38) + (midCtrlY - (startY + curTipY) * 0.5) * 0.6 - ny * w;
      const taper2X = startX + ux * (len * 0.75) + (midCtrlX - (startX + curTipX) * 0.5) * 0.8 - nx * (w * 0.55);
      const taper2Y = startY + uy * (len * 0.75) + (midCtrlY - (startY + curTipY) * 0.5) * 0.8 - ny * (w * 0.55);

      // Shaded Lower Half
      const gradShadow = v.createLinearGradient(startX, startY, curTipX, curTipY);
      gradShadow.addColorStop(0.0, "#2d6a4f");
      gradShadow.addColorStop(0.35, "#38b000");
      gradShadow.addColorStop(0.70, "#52b788");
      gradShadow.addColorStop(1.0, "#95d5b2");

      v.fillStyle = gradShadow;
      v.beginPath();
      v.moveTo(startX, startY);
      v.lineTo(bRx, bRy);
      v.bezierCurveTo(belly2X, belly2Y, taper2X, taper2Y, curTipX, curTipY);
      v.quadraticCurveTo(midCtrlX, midCtrlY, startX, startY);
      v.fill();

      // Sunlit Upper Half
      const gradSun = v.createLinearGradient(startX, startY, curTipX, curTipY);
      gradSun.addColorStop(0.0, "#40916c");
      gradSun.addColorStop(0.30, "#70e000");
      gradSun.addColorStop(0.65, "#74c69d");
      gradSun.addColorStop(0.85, "#b7e4c7");
      gradSun.addColorStop(1.0, "#d8f3dc");

      v.fillStyle = gradSun;
      v.beginPath();
      v.moveTo(startX, startY);
      v.lineTo(bLx, bLy);
      v.bezierCurveTo(belly1X, belly1Y, taper1X, taper1Y, curTipX, curTipY);
      v.quadraticCurveTo(midCtrlX, midCtrlY, startX, startY);
      v.fill();

      // Leaf Border Stroke
      v.strokeStyle = "#b7e4c7";
      v.lineWidth = 1.8;
      v.beginPath();
      v.moveTo(bRx, bRy);
      v.bezierCurveTo(belly2X, belly2Y, taper2X, taper2Y, curTipX, curTipY);
      v.bezierCurveTo(taper1X, taper1Y, belly1X, belly1Y, bLx, bLy);
      v.closePath();
      v.stroke();

      // Glowing Central Midrib Vein
      v.strokeStyle = "rgba(235, 255, 240, 0.95)";
      v.lineWidth = 2.6;
      v.beginPath();
      v.moveTo(startX, startY);
      v.quadraticCurveTo(midCtrlX, midCtrlY, curTipX, curTipY);
      v.stroke();

      // Monocot Longitudinal Striations
      v.strokeStyle = "rgba(183, 228, 199, 0.65)";
      v.lineWidth = 1.2;

      v.beginPath();
      v.moveTo(startX + nx * (w * 0.12), startY + ny * (w * 0.12));
      v.quadraticCurveTo(midCtrlX + nx * (w * 0.38), midCtrlY + ny * (w * 0.38), curTipX, curTipY);
      v.stroke();

      v.beginPath();
      v.moveTo(startX + nx * (w * 0.22), startY + ny * (w * 0.22));
      v.quadraticCurveTo(midCtrlX + nx * (w * 0.68), midCtrlY + ny * (w * 0.68), curTipX, curTipY);
      v.stroke();

      v.beginPath();
      v.moveTo(startX - nx * (w * 0.12), startY - ny * (w * 0.12));
      v.quadraticCurveTo(midCtrlX - nx * (w * 0.38), midCtrlY - ny * (w * 0.38), curTipX, curTipY);
      v.stroke();

      v.beginPath();
      v.moveTo(startX - nx * (w * 0.22), startY - ny * (w * 0.22));
      v.quadraticCurveTo(midCtrlX - nx * (w * 0.68), midCtrlY - ny * (w * 0.68), curTipX, curTipY);
      v.stroke();

      v.restore();
    }

    // --- DRAW DETAILED LANCEOLATE LEAF ALONG STEM ---
    function drawDetailedLanceolateLeaf(v, len, wid, side) {
      v.save();
      const lg = v.createLinearGradient(0, 0, 0, -len);
      lg.addColorStop(0.0, "#2d6a4f");
      lg.addColorStop(0.25, "#38b000");
      lg.addColorStop(0.60, "#52b788");
      lg.addColorStop(0.85, "#95d5b2");
      lg.addColorStop(1.0, "#d8f3dc");

      v.fillStyle = lg;
      v.beginPath();
      v.moveTo(0, 0);

      const tipX = side * (len * 0.32);
      const tipY = -len;

      v.bezierCurveTo(
        -wid * 0.9 + (side * 6), -len * 0.28,
        -wid * 1.1 + (side * 14), -len * 0.65,
        tipX, tipY
      );

      v.bezierCurveTo(
        wid * 1.1 + (side * 14), -len * 0.65,
        wid * 0.9 + (side * 6), -len * 0.28,
        0, 0
      );
      v.fill();

      v.strokeStyle = "#95d5b2";
      v.lineWidth = 1.3;
      v.stroke();

      v.strokeStyle = "rgba(216, 243, 220, 0.75)";
      v.lineWidth = 2.0;
      v.beginPath();
      v.moveTo(0, 0);
      v.quadraticCurveTo(side * 10, -len * 0.5, tipX, tipY);
      v.stroke();

      v.strokeStyle = "rgba(116, 198, 157, 0.4)";
      v.lineWidth = 1.0;
      v.beginPath();
      v.moveTo(-side * 3, -len * 0.1);
      v.quadraticCurveTo(-wid * 0.45 + side * 8, -len * 0.5, tipX, tipY);
      v.stroke();

      v.beginPath();
      v.moveTo(side * 3, -len * 0.1);
      v.quadraticCurveTo(wid * 0.45 + side * 8, -len * 0.5, tipX, tipY);
      v.stroke();

      v.restore();
    }

    // --- DRAW REALISTIC LILY BUD POD ---
    function drawRealisticLilyBud(v, pal, openProgress, timeOffset) {
      v.save();

      const budLen = 52 + openProgress * 18;
      const budWid = 20 + openProgress * 16;
      const splitAmount = openProgress * 14;

      v.fillStyle = "#1b4332";
      v.beginPath();
      v.ellipse(0, 0, 7, 5, 0, 0, Math.PI * 2);
      v.fill();

      if (openProgress > 0.05) {
        v.fillStyle = pal.mid;
        v.beginPath();
        v.ellipse(0, -budLen * 0.65, budWid * 0.45 + splitAmount * 0.4, budLen * 0.35, 0, 0, Math.PI * 2);
        v.fill();

        v.fillStyle = pal.tip;
        v.beginPath();
        v.ellipse(0, -budLen * 0.88, budWid * 0.25, budLen * 0.14, 0, 0, Math.PI * 2);
        v.fill();
      }

      function drawSepal(angleOffset, sepalSpread, isCenter) {
        v.save();
        v.rotate(angleOffset * 0.05);

        const tipX = sepalSpread;
        const tipY = -budLen;

        const sg = v.createLinearGradient(0, 0, tipX, tipY);
        sg.addColorStop(0.0, "#1b4332");
        sg.addColorStop(0.35, "#2d6a4f");
        sg.addColorStop(0.70, "#40916c");
        sg.addColorStop(0.90, openProgress > 0.1 ? pal.base : "#52b788");
        sg.addColorStop(1.0, openProgress > 0.15 ? pal.mid : "#74c69d");

        v.fillStyle = sg;
        v.beginPath();
        v.moveTo(0, 0);

        v.bezierCurveTo(
          -budWid * 0.6 + sepalSpread * 0.3, -budLen * 0.32,
          -budWid * 0.5 + sepalSpread * 0.8, -budLen * 0.72,
          tipX, tipY
        );

        v.bezierCurveTo(
          budWid * 0.5 + sepalSpread * 0.8, -budLen * 0.72,
          budWid * 0.6 + sepalSpread * 0.3, -budLen * 0.32,
          0, 0
        );
        v.fill();

        v.strokeStyle = "#95d5b2";
        v.lineWidth = 1.1;
        v.stroke();

        v.strokeStyle = "rgba(235, 255, 240, 0.7)";
        v.lineWidth = 1.8;
        v.beginPath();
        v.moveTo(0, 0);
        v.quadraticCurveTo(sepalSpread * 0.5, -budLen * 0.5, tipX, tipY);
        v.stroke();

        v.restore();
      }

      drawSepal(-0.35, -splitAmount * 0.85, false);
      drawSepal(0.35, splitAmount * 0.85, false);
      drawSepal(0.0, 0, true);

      v.restore();
    }

    // --- DRAW BLOOMING ASIATIC LILY ---
    function drawBloomingLily(v, bloom, pal, timeOffset) {
      v.save();

      const numPetals = 6;
      const baseLen = 135;
      const maxLen = baseLen * (0.35 + 0.65 * bloom);
      const maxWid = 44 * (0.28 + 0.72 * bloom);

      const throatR = 24 * bloom;
      const tg = v.createRadialGradient(0, 0, 2, 0, 0, Math.max(8, throatR * 1.5));
      tg.addColorStop(0.0, pal.throatGreen);
      tg.addColorStop(0.5, pal.throat);
      tg.addColorStop(1.0, "rgba(0,0,0,0)");
      v.fillStyle = tg;
      v.beginPath();
      v.arc(0, 0, Math.max(8, throatR * 1.5), 0, Math.PI * 2);
      v.fill();

      // Outer 3 Sepals
      for (let i = 0; i < 3; i++) {
        const angle = (i * 2 * Math.PI) / 3;
        drawAsiaticPetal(v, angle, maxLen * 0.96, maxWid * 0.90, bloom, pal, false, timeOffset + i);
      }

      // Inner 3 Petals
      for (let i = 0; i < 3; i++) {
        const angle = (i * 2 * Math.PI) / 3 + Math.PI / 3;
        drawAsiaticPetal(v, angle, maxLen, maxWid, bloom, pal, true, timeOffset + i + 3);
      }

      // Stamens & Pistil
      if (bloom > 0.40) {
        const stamProg = (bloom - 0.40) / 0.60;
        const filamentLen = 58 * stamProg;

        for (let s = 0; s < 6; s++) {
          const sAngle = (s * Math.PI) / 3 + Math.PI / 6;
          const sSpread = filamentLen * 0.72;
          const fx = Math.cos(sAngle) * sSpread;
          const fy = Math.sin(sAngle) * sSpread - 12 * stamProg;

          v.strokeStyle = pal.stamen;
          v.lineWidth = 2.0;
          v.beginPath();
          v.moveTo(0, 0);
          v.quadraticCurveTo(fx * 0.4, fy * 0.4 - 5, fx, fy);
          v.stroke();

          v.save();
          v.translate(fx, fy);
          v.rotate(sAngle + Math.PI / 2 + Math.sin(timeOffset + s) * 0.2);
          v.fillStyle = pal.anther;
          v.strokeStyle = "#5a189a";
          v.lineWidth = 0.8;
          v.beginPath();
          v.ellipse(0, 0, 3.5, 9.5, 0, 0, Math.PI * 2);
          v.fill();
          v.stroke();
          v.restore();
        }

        // Central Pistil
        const pistilLen = 65 * stamProg;
        v.strokeStyle = pal.throatGreen;
        v.lineWidth = 3.2;
        v.beginPath();
        v.moveTo(0, 0);
        v.lineTo(0, -pistilLen);
        v.stroke();

        v.fillStyle = "#38b000";
        for (let lobe = 0; lobe < 3; lobe++) {
          const la = (lobe * 2 * Math.PI) / 3;
          v.beginPath();
          v.arc(Math.cos(la) * 3.5, -pistilLen + Math.sin(la) * 2.5, 3.2, 0, Math.PI * 2);
          v.fill();
        }
      }

      v.restore();
    }

    // --- DRAW INDIVIDUAL ASIATIC PETAL ---
    function drawAsiaticPetal(v, angle, len, wid, bloom, pal, isInner, seedOffset) {
      v.save();
      v.rotate(angle);

      const recurve = Math.pow(bloom, 1.4) * 0.42;
      const endY = -len * (1.0 - recurve * 0.22);
      const tipCurl = recurve * 38;

      const g = v.createLinearGradient(0, 0, 0, endY);
      g.addColorStop(0.0, pal.throatGreen);
      g.addColorStop(0.14, pal.throat);
      g.addColorStop(0.38, pal.base);
      g.addColorStop(0.72, pal.mid);
      g.addColorStop(0.93, pal.tip);
      g.addColorStop(1.0, pal.edge);

      v.fillStyle = g;
      v.beginPath();
      v.moveTo(0, 0);

      v.bezierCurveTo(
        -wid * 0.85, endY * 0.28,
        -wid * 0.95, endY * 0.68,
        tipCurl * 0.35, endY
      );

      v.bezierCurveTo(
        wid * 0.95, endY * 0.68,
        wid * 0.85, endY * 0.28,
        0, 0
      );
      v.fill();

      v.strokeStyle = pal.edge;
      v.lineWidth = 1.2;
      v.stroke();

      v.strokeStyle = "rgba(255, 255, 255, 0.45)";
      v.lineWidth = 1.8;
      v.beginPath();
      v.moveTo(0, 0);
      v.quadraticCurveTo(0, endY * 0.5, tipCurl * 0.35, endY * 0.96);
      v.stroke();

      if (bloom > 0.35 && isInner) {
        v.fillStyle = pal.spots;
        const seed = Math.abs(Math.sin(angle * 6.3));
        for (let sp = 1; sp <= 11; sp++) {
          const sy = endY * (0.16 + sp * 0.045);
          const sx = (Math.sin(seed * sp * 13) * wid * 0.38) * (1 - sp * 0.07);
          v.beginPath();
          v.arc(sx, sy, 1.6, 0, Math.PI * 2);
          v.fill();
        }
      }

      v.restore();
    }

    // --- MAIN RENDER LOOP ---
    function render() {
      if (isPlaying) {
        bloomProgress += CONFIG.bloomSpeed;
        if (bloomProgress > 1.0) {
          bloomProgress = 1.0;
          isPlaying = false;
          updateIcons();
        }
        document.getElementById("bloom-slider").value = bloomProgress;
        document.getElementById("bloom-val").innerText = `${Math.round(bloomProgress * 100)}%`;
      }
      time += CONFIG.windSpeed;

      // 1. Draw Combined Vector Scene (Clara + Bouquet + Dynamic Atmosphere)
      drawVectorScene(vCtx, bloomProgress, time);

      // 2. Clear Display Canvas with deep black
      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, w, h);

      // 3. Grid sizing for ASCII conversion
      const chars = ASCII_RAMP;
      const charLen = chars.length;
      const fontSize = CONFIG.fontSize;
      const charW = fontSize * CONFIG.charAspect;
      const charH = fontSize;

      const scale = Math.min((w * 0.96) / CONFIG.baseW, (h * 0.96) / CONFIG.baseH);
      const sceneW = CONFIG.baseW * scale;
      const sceneH = CONFIG.baseH * scale;
      const offX = (w - sceneW) * 0.5;
      const offY = (h - sceneH) * 0.5;

      const cols = Math.floor(sceneW / charW);
      const rows = Math.floor(sceneH / charH);

      const imgData = vCtx.getImageData(0, 0, CONFIG.baseW, CONFIG.baseH);
      const data = imgData.data;

      ctx.font = `${fontSize}px 'JetBrains Mono', monospace`;
      ctx.textBaseline = "top";

      // 4. Background ASCII Stars & Drifting Floral Petals
      sparkles.forEach(s => {
        s.x += s.speedX;
        s.y += s.speedY;
        if (s.x < 0) s.x = CONFIG.baseW;
        if (s.y < 0) s.y = CONFIG.baseH;
        if (s.y > CONFIG.baseH) s.y = 0;

        const tw = Math.sin(time * 60 * s.twinkleSpeed + s.offset);
        if (tw > -0.2) {
          const alpha = Math.max(0.15, (tw + 0.2) * 0.85);
          const sx = offX + (s.x / CONFIG.baseW) * sceneW;
          const sy = offY + (s.y / CONFIG.baseH) * sceneH;
          ctx.fillStyle = s.baseColor + alpha + ")";
          ctx.fillText(s.char, sx, sy);
        }
      });

      // 5. Draw Scene in Colored ASCII Characters
      for (let r = 0; r < rows; r++) {
        const sampleY = Math.floor((r / rows) * CONFIG.baseH);
        const drawY = offY + r * charH;

        for (let c = 0; c < cols; c++) {
          const sampleX = Math.floor((c / cols) * CONFIG.baseW);
          const drawX = offX + c * charW;

          const idx = (sampleY * CONFIG.baseW + sampleX) * 4;
          const red = data[idx];
          const green = data[idx + 1];
          const blue = data[idx + 2];
          const alpha = data[idx + 3] / 255;

          if (alpha > 0.04) {
            const maxVal = Math.max(red, green, blue);
            const avgVal = (red + green + blue) / 3;

            // Cut off noise in pure black background
            if (maxVal < 14) continue;

            const intensity = Math.min(1.0, (avgVal * 0.35 + maxVal * 0.65) / 235);
            const charIdx = Math.min(charLen - 1, Math.floor(intensity * charLen));
            const char = chars[charIdx];

            // Subtle color saturation enhancement
            const boostR = Math.min(255, Math.floor(red * 1.22));
            const boostG = Math.min(255, Math.floor(green * 1.22));
            const boostB = Math.min(255, Math.floor(blue * 1.22));

            ctx.fillStyle = `rgba(${boostR}, ${boostG}, ${boostB}, ${Math.min(1.0, alpha * 1.35)})`;
            ctx.fillText(char, drawX, drawY);
          }
        }
      }

      requestAnimationFrame(render);
    }

    // --- INTERACTIVE UI CONTROLS ---
    const btnPlay = document.getElementById("btn-play");
    const btnRestart = document.getElementById("btn-restart");
    const slider = document.getElementById("bloom-slider");
    const label = document.getElementById("bloom-val");
    const iconPlay = document.getElementById("icon-play");
    const iconPause = document.getElementById("icon-pause");

    function updateIcons() {
      if (isPlaying) {
        iconPlay.style.display = "none";
        iconPause.style.display = "block";
      } else {
        iconPlay.style.display = "block";
        iconPause.style.display = "none";
      }
    }

    btnPlay.addEventListener("click", () => {
      if (bloomProgress >= 1.0) bloomProgress = 0.0;
      isPlaying = !isPlaying;
      updateIcons();
    });

    btnRestart.addEventListener("click", () => {
      bloomProgress = 0.0;
      isPlaying = true;
      updateIcons();
    });

    slider.addEventListener("input", (e) => {
      isPlaying = false;
      bloomProgress = parseFloat(e.target.value);
      label.innerText = `${Math.round(bloomProgress * 100)}%`;
      updateIcons();
    });

    window.setBloom = function(val) {
      isPlaying = false;
      bloomProgress = val;
      slider.value = val;
      label.innerText = `${Math.round(val * 100)}%`;
      updateIcons();
    };

    updateIcons();
    requestAnimationFrame(render);
  </script>
</body>
</html>
